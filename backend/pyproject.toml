[project]
name = "wastelink-bali-backend"
version = "0.1.0"
description = "WasteLink Bali — Backend API for community waste management and circular economy platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "alembic>=1.13.0,<2.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0,<26.0",
    "email-validator>=2.0.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-cov>=5.0.0,<8.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "docs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "T20"]
ignore = ["S101", "S104", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/*" = ["I001", "UP007", "UP035"]
"app/cli/*" = ["T201", "T203", "E402", "S105", "F401", "I001", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic", "tests", "app/cli"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
