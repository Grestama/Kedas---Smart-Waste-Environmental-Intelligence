else if(mobileTab==='points'){body=`<div class="phone-greet">WastePoints</div><div class="phone-greet-sub">Poinmu dari setoran yang sudah diverifikasi.</div><div class="phone-hero" style="min-height:135px"><div class="eyebrow">SALDO TERSEDIA</div><h3 style="font-size:27px">1.240 poin</h3><p>Poin bukan saldo uang tunai.</p></div><div class="phone-section-title">Riwayat poin</div>${[['+180','Setoran WL-2026-0172','24 Okt'],['+140','Setoran WL-2026-0161','20 Okt'],['−100','Penukaran benefit','18 Okt']].map((r,i)=>`<div class="phone-active" style="margin-bottom:9px"><div class="phone-active-row"><div><div class="phone-active-title">${r[1]}</div><div class="pickup-meta">${r[2]} 2026</div></div><strong style="color:${i===2?'var(--danger)':'var(--success)'}">${r[0]}</strong></div></div>`).join('')}`}
else if(mobileTab==='profile'){body=`<div class="phone-greet">Profil</div><div class="phone-greet-sub">Akun dan preferensi.</div><div class="phone-active" style="display:flex;align-items:center;gap:12px"><div class="avatar">GN</div><div><div class="phone-active-title">Grestama Naufal</div><div class="pickup-meta">grestama@example.test</div></div></div><div class="phone-section-title">Pengaturan</div>${[['Profil pribadi','users'],['Notifikasi','bell'],['Panduan pemilahan','recycle'],['Bantuan dan komplain','help'],['Privasi dan keamanan','shield']].map(([t,i])=>`<button class="category-tile" style="width:100%;margin-bottom:8px" data-action="toast" data-message="Bagian ${t} berupa contoh navigasi dalam prototipe."><span class="category-illustration">${icon(i)}</span><span class="category-name">${t}</span><span style="margin-left:auto">${icon('chevron')}</span></button>`).join('')}`}
else{body=`<div class="phone-greet">Buat setoran</div><div class="phone-greet-sub">Pilih kategori untuk memulai permintaan.</div><div class="notice warning" style="font-size:10px">${icon('shield')}Limbah khusus perlu jalur penanganan terpisah.</div><div class="phone-section-title">Kategori sampah</div>${[['Organik basah','Sisa makanan dan sayur','leaf2'],['Anorganik bernilai','Plastik, kertas, logam tertentu','recycle'],['Residu','Material residu rumah tangga','box'],['Limbah khusus','Baterai, lampu, bahan kimia','shield']].map(([t,d,i])=>`<button class="category-tile" style="width:100%;margin-bottom:9px" data-category="${t}" data-action="selectMobileCategory"><span class="category-illustration">${icon(i)}</span><span><span class="category-name">${t}</span><span class="category-help" style="display:block">${d}</span></span><span style="margin-left:auto">${icon('chevron')}</span></button>`).join('')}`}
return `<div class="phone"><div class="phone-status"><span>09:41</span><span>● ● ▰</span></div><div class="phone-header"><div class="phone-brand"><span class="brandmark">${icon('leaf')}</span> WasteLink Bali</div><button class="icon-btn" style="height:32px;width:32px" data-action="toast" data-message="Tidak ada notifikasi baru.">${icon('bell')}</button></div><div class="phone-scroll">${body}</div><nav class="bottom-nav">${[['home','Beranda','home'],['create','Setor','plus'],['history','Aktivitas','box'],['points','Poin','gift'],['profile','Profil','users']].map(([id,label,ic])=>`<button class="${mobileTab===id?'active':''} ${id==='create'?'primary-tab':''}" data-mobile="${id}"><span class="${id==='create'?'tab-icon':''}">${icon(ic)}</span>${label}</button>`).join('')}</nav></div><aside class="mobile-notes"><div class="eyebrow" style="color:var(--brand-700);margin-bottom:10px">MOBILE · USER ONLY</div><h2>Pengalaman warga yang ringan dan jelas.</h2><p>UI mobile dirancang untuk satu tangan, aksi utama mudah ditemukan, dan status penjemputan bisa dipantau tanpa membaca banyak informasi.</p><div class="mobile-note-list"><div class="mobile-note-item"><div class="mobile-note-icon">${icon('plus')}</div><div><strong>Aksi utama langsung terlihat</strong><span>Warga dapat membuat setoran tanpa melewati banyak menu.</span></div></div><div class="mobile-note-item"><div class="mobile-note-icon">${icon('route')}</div><div><strong>Status dapat dipahami</strong><span>Label dan progres selalu disertai keterangan, bukan warna saja.</span></div></div><div class="mobile-note-item"><div class="mobile-note-icon">${icon('shield')}</div><div><strong>Privasi berdasarkan izin</strong><span>Lokasi dan kamera hanya diminta saat fitur memang membutuhkannya.</span></div></div><div class="notice" style="margin-top:12px">${icon('file')}<div>Ini prototype visual interaktif. Data contoh, autentikasi, dan penyimpanan belum terhubung ke backend.</div></div></div></aside>`}
function render(){document.body.classList.toggle('mobile-mode',mode==='mobile');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.getElementById('desktopRoot').classList.toggle('hide',mode==='mobile');document.getElementById('mobileRoot').classList.toggle('hide',mode!=='mobile');if(mode!=='mobile'){document.getElementById('sidebar').innerHTML=sideNav();document.getElementById('mainContent').innerHTML=pageContent()}else{document.getElementById('mobileRoot').innerHTML=mobileContent()}}
function toast(message){let el=document.getElementById('toast');el.textContent=message||'Aksi simulasi';el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3100)}
function openModal(category){document.getElementById('modalBody').innerHTML=`<div class="split"><div><div class="eyebrow" style="color:var(--brand-700)">PERMINTAAN BARU</div><h2 id="modalTitle">Buat setoran sampah</h2></div><button class="icon-btn" data-action="close" aria-label="Tutup">${icon('close')}</button></div><p>Lengkapi detail dasar. Ini hanya simulasi tampilan, belum mengirim data ke backend.</p><div class="modal-grid">${[['Organik basah','leaf2'],['Anorganik bernilai','recycle'],['Residu','box'],['Limbah khusus','shield']].map(([t,i])=>`<button class="category-tile" data-action="pick" data-category="${t}" style="${category===t?'border-color:var(--brand-700);background:var(--brand-100)':''}"><span class="category-illustration">${icon(i)}</span><span class="category-name">${t}</span></button>`).join('')}</div><div class="form-row"><label>Jumlah kantong / wadah (perkiraan)</label><select id="quantity"><option>1</option><option selected>2</option><option>3</option><option>4 atau lebih</option></select></div><div class="form-row"><label>Alamat penjemputan</label><input id="address" value="Banjar Sukapura, Bali (contoh)" /></div><div class="form-row"><label>Jadwal yang diinginkan</label><select id="slot"><option>Kamis, 29 Okt · 15.00–17.00 WITA</option><option>Jumat, 30 Okt · 09.00–11.00 WITA</option><option>Jumat, 30 Okt · 15.00–17.00 WITA</option></select></div><div class="notice warning">${icon('shield')}<div>Berat dan poin final ditentukan setelah inspeksi serta penimbangan oleh petugas terverifikasi. Limbah khusus tidak diproses sebagai setoran biasa.</div></div><div class="modal-actions"><button class="btn btn-secondary" data-action="close">Batal</button><button class="btn btn-primary" data-action="submitPickup">Lanjutkan</button></div>`;document.getElementById('modalBackdrop').classList.add('open')}
let chosenCategory='Anorganik bernilai';
document.addEventListener('click',e=>{let target=e.target.closest('button');if(!target)return;if(target.dataset.mode){mode=target.dataset.mode;page='overview';mobileTab='home';render();return}if(target.dataset.nav){page=target.dataset.nav;render();return}if(target.dataset.mobile){let m=target.dataset.mobile;if(m==='create'){mobileTab='create'}else mobileTab=m;render();return}if(target.dataset.category){chosenCategory=target.dataset.category;if(target.dataset.action==='selectMobileCategory'){toast(`Kategori dipilih: ${chosenCategory}. Lengkapi lokasi dan jadwal pada alur setoran.`);mobileTab='create';render();return}if(target.dataset.action==='pick'){openModal(chosenCategory);return}}let action=target.dataset.action;if(action==='create'){openModal(chosenCategory)}else if(action==='close'){document.getElementById('modalBackdrop').classList.remove('open')}else if(action==='toast'){toast(target.dataset.message)}else if(action==='detail'){if(mode==='collector')page='weigh';else toast('Detail #WL-2026-0184 · status simulasi: dalam penjemputan.');render()}else if(action==='accept'){toast('Tugas diterima pada simulasi. Integrasi nyata harus memanggil API accept dengan idempotency key.');}else if(action==='weigh'){page='weigh';render()}else if(action==='complete'){toast('Validasi diperlukan: berat, inspeksi, bukti, dan state harus diterima backend sebelum tugas selesai.')}else if(action==='submitPickup'){let q=document.getElementById('quantity')?.value||'2';let address=document.getElementById('address')?.value||'Alamat belum ditentukan';let slot=document.getElementById('slot')?.value||'Jadwal belum ditentukan';if(chosenCategory==='Limbah khusus'){toast('Limbah khusus tidak dapat dikirim lewat alur setoran biasa. Hubungi pengelola untuk jalur yang sesuai.');return}document.getElementById('modalBackdrop').classList.remove('open');toast(`Simulasi setoran dibuat: ${chosenCategory}, ${q} wadah. Belum tersimpan ke backend.`);if(mode==='mobile'){mobileTab='history';render()}}});
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalBackdrop').classList.remove('open')});render();
</script>
</body>
